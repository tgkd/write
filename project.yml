name: Write
options:
  bundleIdPrefix: com.j.write
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.3"
  minimumXcodeGenVersion: "2.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.11"
    CURRENT_PROJECT_VERSION: "62"
packages:
  SVGPath:
    url: https://github.com/nicklockwood/SVGPath
    from: "1.1.4"
targets:
  Write:
    type: application
    platform: iOS
    sources:
      - Write
      - Shared
    resources:
      - path: Write/Resources
        excludes:
          - "*.swift"
    settings:
      base:
        INFOPLIST_FILE: Write/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.j.write
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ULU867Y7LC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    entitlements:
      path: Write/Write.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.j.write
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - package: SVGPath
      - target: WriteWidget
    info:
      path: Write/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Write
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.j.write
            CFBundleURLSchemes:
              - kakijun
  WriteWidget:
    type: app-extension
    platform: iOS
    sources:
      - WriteWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j.write.widget
        INFOPLIST_FILE: WriteWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ULU867Y7LC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: WriteWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Write
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WriteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WriteTests
      - path: WriteWidget/Resources/daily_kanji.json
        buildPhase: resources
    resources:
      - path: Write/Resources/kanji_strokes.json
    dependencies:
      - target: Write
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  WriteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WriteUITests
    dependencies:
      - target: Write
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Write
        DEVELOPMENT_TEAM: ULU867Y7LC
        CODE_SIGN_STYLE: Automatic
schemes:
  WriteUITests:
    build:
      targets:
        Write: all
        WriteUITests: [test]
    test:
      config: Debug
      targets:
        - WriteUITests
  Write:
    build:
      targets:
        Write: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WriteTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
